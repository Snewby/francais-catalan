name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run format:check

      - run: npm run test:run

      # The invariant machinery. These are stubs until phase 1, at which point
      # a broken closed vocabulary or a leaf missing glosses.fr fails CI.
      - run: npm run validate-ids

      - run: npm run check-glosses
