name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run format:check

      - run: npm run test:run

      # The phase 1 model eval, offline and free: replays the committed
      # recordings against the verdicts in the golden-v2 fixtures. Fails when
      # the app's model no longer clears every floor, or when the prompt has
      # changed since it was recorded (docs/model-eval.md).
      - run: npm run eval

      # The phase 2 variant eval, offline: replays the variant recordings
      # through the app's own client. Ungated while the variant model is
      # provisional (docs/variant-eval.md), so it fails only when a recording
      # no longer replays; `--gate <model>` is added once the floors are settled.
      - run: npm run eval:variants

      # One Playwright smoke at 390 px against the production build under the
      # Pages base path: layout, overflow and tap targets jsdom cannot measure.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      # The invariant machinery, live since phase 1. A component ID referenced
      # anywhere but absent from the taxonomy, or a leaf without glosses.fr or
      # a valid contrast_fr, fails CI here. These run last, so a red lint,
      # typecheck, format or test step means they never executed at all: a
      # green badge on an earlier step is not evidence the taxonomy was
      # checked. That has already happened once, for the whole NOM seed.
      - run: npm run validate-ids

      - run: npm run check-glosses

      # Two leaves teaching one rule under two keys satisfy both checks above,
      # and did twice, in the CONJ and ADV seeds. This one fails on an
      # unrecorded collision; legitimate overlaps live in
      # data/duplicate-allowlist.json with a rationale each.
      - run: npm run check-duplicates
